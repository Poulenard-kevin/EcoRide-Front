<div class="hero-scene">
  <div class="hero-scene-content">
      <h1 class="big-title">Détail</h1>
  </div>
</div>


<section class="detail-container">

  <div class="profile-section">
    <div class="profile-photo">
      <img id="detail-photo" src="/images/default-avatar.png" alt="Profil" />
    </div>
    <div class="profile-info">
      <h2 id="detail-pseudo" class="pseudo">Chargement...</h2>
      <p id="detail-rating" class="rating">☆☆☆☆☆</p>
    </div>
    <div class="actions">
      <span id="detail-type" class="type-economique">—</span>
    </div>
  </div>

  <div class="trip-dates">
    <span id="detail-date" class="badge badge-date">—</span>
    <div class="locations-times">
      <div class="location-time">
        <span id="detail-depart" class="location">—</span>
        <span id="detail-heureDepart" class="time-depart">—</span>
      </div>
      <div class="location-time">
        <span id="detail-arrivee" class="location">—</span>
        <span id="detail-heureArrivee" class="time-arrivee">—</span>
      </div>
    </div>
  </div>

  <div class="section-titles">
    <div class="info-title">
      <h1>Informations</h1>
    </div>
    <div class="preferences-title">
      <h1>Préférences</h1> 
    </div>
  </div>

  <div class="info-preferences">
    <div class="info">
      <h3 id="detail-prix" class="info-item">Prix : — crédits</h3>
      <h3 id="detail-duree" class="info-item">Durée : —</h3>
      <h3 id="detail-places" class="info-item">Places disponibles : —</h3>
    </div>
    <div class="preferences">
      <h3 id="detail-pref1" class="pref-item">—</h3>
      <h3 id="detail-pref2" class="pref-item">—</h3>
      <h3 id="detail-pref3" class="pref-item">—</h3>
      <h3 id="detail-pref4" class="pref-item"></h3>
    </div>
  </div>

  <h1>Véhicule</h1>
  <div class="vehicle-info">
    <h3 id="detail-vehicle-marque" class="vehicle-item">—</h3>
    <h3 id="detail-vehicle-model" class="vehicle-item">—</h3>
    <h3 id="detail-vehicle-color" class="vehicle-item">—</h3>
    <h3 id="detail-vehicle-type" class="vehicle-item">—</h3>
  </div>

  <h1>À propos du conducteur</h1>
  <div class="about">
    <h3 id="driver-about-text" class="about-text">Chargement...</h3>
  </div>

  <h1>Avis du conducteur</h1>
  <div class="driver-reviews">
    <blockquote id="detail-review1" class="review">Chargement des avis...</blockquote>
    <blockquote id="detail-review2" class="review"></blockquote>
    <blockquote id="detail-review3" class="review"></blockquote>
  </div>

</section>
